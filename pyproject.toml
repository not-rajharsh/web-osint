[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osint-scraper"
description = "CLI web scraping and OSINT extraction toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Harsh Raj" }]
keywords = ["osint", "scraping", "cli", "recon"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "requests>=2.31,<3",
    "beautifulsoup4>=4.12,<5",
    "rich>=13.7,<15",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
    "types-requests>=2.31",
    "types-beautifulsoup4>=4.12",
]

[project.scripts]
osint-scraper = "osint_scraper.scraper:main"

[tool.setuptools.dynamic]
version = { attr = "osint_scraper.config.__version__" }

[tool.setuptools.packages.find]
include = ["osint_scraper*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.10"
disallow_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
